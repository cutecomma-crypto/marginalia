<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginalia</title>
<script>
// 深夜莫蘭迪配色方案：在任何 CSS／模組化 JS 載入之前，同步讀一次 localStorage
// 裡存的主題偏好、把 data-theme 屬性補上 <html>——一定要用這種不經過
// type="module"（本身就是 defer，會等整份文件解析完才執行）的普通同步
// <script>，而且放在 <head> 最前面幾行，才能在瀏覽器真正畫出第一張畫面
// 之前就決定好主題，不然使用者選了深色模式，每次重新整理都會先看到一瞬間
// 的淺色畫面才「跳」成深色（Flash of Unstyled/Wrong Theme），視覺上很刺眼。
(function() {
  try {
    if (localStorage.getItem('marginalia:theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
})();
</script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/services.css">
</head>
<body>
<header>
  <div class="header-left">
    <button type="button" class="sidebar-drawer-toggle-btn" id="sidebar-drawer-toggle-btn" data-tooltip="藏書統計" aria-label="藏書統計">
      <img src="favicon.png" alt="" class="sidebar-drawer-toggle-icon">
    </button>
    <h1>
      <a href="#/books" id="brand-logo-link" class="brand-logo">
        <span class="brand-logo-text">Marginalia</span>
        <span class="brand-flight" aria-hidden="true">
          <svg class="brand-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 7v14"></path>
            <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path>
          </svg>
          <svg class="brand-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </span>
      </a>
    </h1>
  </div>
  <div class="header-right">
    <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="切換日／夜間模式"></button>
    <nav><a href="#/backup">資料管理</a></nav>
    <div id="auth-status-slot" class="auth-status-slot"></div>
  </div>
</header>
<main id="app">
  <div class="page-skeleton" aria-hidden="true">
    <div class="skeleton-bar skeleton-bar-title"></div>
    <div class="skeleton-bar skeleton-bar-wide"></div>
    <div class="skeleton-bar skeleton-bar-wide"></div>
    <div class="skeleton-bar skeleton-bar-narrow"></div>
  </div>
</main>
<script src="js/vendor/d3.min.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/bootstrap-extensions.js"></script>
</body>
</html>
